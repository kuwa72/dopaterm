# dopaterm configuration — save as <config dir>/dopaterm/config.toml
# Linux/macOS: ~/.config/dopaterm/config.toml
# Windows:     %APPDATA%\dopaterm\config.toml

font_size = 14.0
# font_family = "Cascadia Mono"   # default: auto-select a system monospace with box-drawing/symbols
# shell = "powershell.exe"          # default: $SHELL / powershell.exe
# shell_args = ["-NoLogo"]
amount = 1.0                     # global effect amount 0.0–1.0 (0 = all off)
background = "#1d1f21"
foreground = "#c5c8c6"

[effects]
# Per-effect amounts; unset keys inherit `amount`. 0 disables that effect.
# [effects.amounts]
# sparks = 0.5        # keystroke sparks
# shatter = 0.0       # erased-character shards off
# cursor_trail = 1.0
# scroll_trail = 1.0  # scrollback speed lines
# fireworks = 1.0
# wait_pulse = 1.0
# confetti = 1.0
# output_rain = 1.0
# process_error = 1.0
# bell_flash = 1.0
# char_jump = 1.0     # occasional glyph hop

# lua_dir = "/path/to/effects"     # default: <config dir>/effects/*.lua
